apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-gateway-kind-demo
  namespace: argocd
  labels:
    app.kubernetes.io/name: ai-gateway
    app.kubernetes.io/component: gitops-application
    app.kubernetes.io/part-of: airgap-ai-gateway
    airgap.ai.gateway/baseline: v1.3.1
    airgap.ai.gateway/profile: kind-demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: airgap-ai-gateway
  source:
    repoURL: https://github.com/ahmed658/airgap-ai-gateway-platform.git
    targetRevision: main
    path: gitops/argocd/managed-overlays/kind-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - FailOnSharedResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
