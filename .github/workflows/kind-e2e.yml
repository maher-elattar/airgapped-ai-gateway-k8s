name: kind-e2e

"on":
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/kind-e2e.yml
      - airgap/**
      - examples/**
      - lab/**
      - manifests/**
      - scripts/kind_e2e_lab.py
      - src/airgap_ai_gateway/**
      - tests/**
      - pyproject.toml
      - requirements*.txt
      - constraints.txt
  push:
    branches:
      - main
    paths:
      - .github/workflows/kind-e2e.yml
      - airgap/**
      - examples/**
      - lab/**
      - manifests/**
      - scripts/kind_e2e_lab.py
      - src/airgap_ai_gateway/**
      - tests/**
      - pyproject.toml
      - requirements*.txt
      - constraints.txt

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-gateway-lab:
    name: disposable-gateway-lab
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install Python tooling
        run: python -m pip install --disable-pip-version-check -c constraints.txt -r requirements-dev.txt -e .

      - name: Install kind, kubectl, and Helm
        env:
          KIND_URL: https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/kind-linux-amd64
          KIND_SHA256: 517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889
          KUBECTL_URL: https://dl.k8s.io/release/v1.33.4/bin/linux/amd64/kubectl
          KUBECTL_SHA256: c2ba72c115d524b72aaee9aab8df8b876e1596889d2f3f27d68405262ce86ca1
          HELM_URL: https://get.helm.sh/helm-v3.18.6-linux-amd64.tar.gz
          HELM_SHA256: 3f43c0aa57243852dd542493a0f54f1396c0bc8ec7296bbb2c01e802010819ce
        run: |
          set -euo pipefail
          tools_dir="${RUNNER_TEMP}/ci-tools"
          bin_dir="${tools_dir}/bin"
          mkdir -p "${bin_dir}"
          curl -fsSL "${KIND_URL}" -o "${bin_dir}/kind"
          echo "${KIND_SHA256}  ${bin_dir}/kind" | sha256sum -c -
          chmod +x "${bin_dir}/kind"
          curl -fsSL "${KUBECTL_URL}" -o "${bin_dir}/kubectl"
          echo "${KUBECTL_SHA256}  ${bin_dir}/kubectl" | sha256sum -c -
          chmod +x "${bin_dir}/kubectl"
          curl -fsSL "${HELM_URL}" -o "${tools_dir}/helm.tar.gz"
          echo "${HELM_SHA256}  ${tools_dir}/helm.tar.gz" | sha256sum -c -
          tar -xzf "${tools_dir}/helm.tar.gz" -C "${tools_dir}"
          cp "${tools_dir}/linux-amd64/helm" "${bin_dir}/helm"
          chmod +x "${bin_dir}/helm"
          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Run disposable gateway lab
        env:
          AIRGAP_LAB_RUNS_DIR: ${{ runner.temp }}/kind-runs
        run: python scripts/kind_e2e_lab.py run

      - name: Upload redacted lab evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kind-e2e-evidence
          path: |
            ${{ runner.temp }}/kind-runs/**/evidence/*.json
            ${{ runner.temp }}/kind-runs/**/evidence/*.xml
            ${{ runner.temp }}/kind-runs/**/evidence/*.md
          if-no-files-found: error
          retention-days: 7
