name: unit

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install test environment
        run: python -m pip install --disable-pip-version-check -c constraints.txt -r requirements-dev.txt -e .

      - name: Run unit tests with coverage
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/junit" "${RUNNER_TEMP}/coverage"
          pytest \
            --junitxml="${RUNNER_TEMP}/junit/pytest.xml" \
            --cov-report=xml:"${RUNNER_TEMP}/coverage/coverage.xml" \
            --cov-report=term-missing

      - name: Upload test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unit-test-evidence
          path: |
            ${{ runner.temp }}/junit/pytest.xml
            ${{ runner.temp }}/coverage/coverage.xml
          if-no-files-found: error
          retention-days: 7
