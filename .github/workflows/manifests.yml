name: manifests

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-validation:
    name: manifest-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install Python tooling
        run: python -m pip install --disable-pip-version-check -c constraints.txt -r requirements-dev.txt -e .

      - name: Install manifest tools
        env:
          KUSTOMIZE_URL: https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz
          KUSTOMIZE_SHA256: ea375e7372f9aa029129d4b2d16c66b7750b7f1213c4f66f910d981c895818d8
          KUBECONFORM_URL: https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
        run: |
          set -euo pipefail
          tools_dir="${RUNNER_TEMP}/ci-tools"
          bin_dir="${tools_dir}/bin"
          mkdir -p "${bin_dir}"
          curl -fsSL "${KUSTOMIZE_URL}" -o "${tools_dir}/kustomize.tar.gz"
          echo "${KUSTOMIZE_SHA256}  ${tools_dir}/kustomize.tar.gz" | sha256sum -c -
          tar -xzf "${tools_dir}/kustomize.tar.gz" -C "${bin_dir}"
          chmod +x "${bin_dir}/kustomize"
          curl -fsSL "${KUBECONFORM_URL}" -o "${tools_dir}/kubeconform.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${tools_dir}/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "${tools_dir}/kubeconform.tar.gz" -C "${bin_dir}" kubeconform
          chmod +x "${bin_dir}/kubeconform"
          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Render overlays with kustomize
        run: |
          set -euo pipefail
          out_dir="${RUNNER_TEMP}/manifests"
          mkdir -p "${out_dir}"
          for overlay in kind-demo retained-nginx-edge production-reference; do
            kustomize build "manifests/baseline-v1.3.1/overlays/${overlay}" \
              > "${out_dir}/${overlay}.yaml"
          done

      - name: Schema validate rendered manifests
        run: kubeconform -strict -ignore-missing-schemas -summary "${RUNNER_TEMP}/manifests"/*.yaml

      - name: Run semantic manifest policy checks
        run: python scripts/validate_manifests.py --require-kustomize --summary > "${RUNNER_TEMP}/manifests/semantic-summary.yaml"

      - name: Verify rendered image map
        run: |
          set -euo pipefail
          airgap-ai-gateway --config examples/config verify \
            --lock-file airgap/sources.lock.yaml \
            --compatibility-set baseline-v1.3.1 \
            --registry registry.example.internal:5000

      - name: Upload manifest evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: manifest-validation-evidence
          path: |
            ${{ runner.temp }}/manifests/*.yaml
          if-no-files-found: error
          retention-days: 7
