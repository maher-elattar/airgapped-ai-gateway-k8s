name: security

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gates:
    name: security-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install Python security tooling
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -c constraints.txt -r requirements-dev.txt -e .
          python -m pip install --disable-pip-version-check pip-audit==2.9.0

      - name: Install Gitleaks and actionlint
        env:
          GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.29.1/gitleaks_8.29.1_linux_x64.tar.gz
          GITLEAKS_SHA256: e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924
          ACTIONLINT_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          tools_dir="${RUNNER_TEMP}/ci-tools"
          bin_dir="${tools_dir}/bin"
          mkdir -p "${bin_dir}"
          curl -fsSL "${GITLEAKS_URL}" -o "${tools_dir}/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  ${tools_dir}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${tools_dir}/gitleaks.tar.gz" -C "${bin_dir}" gitleaks
          chmod +x "${bin_dir}/gitleaks"
          curl -fsSL "${ACTIONLINT_URL}" -o "${tools_dir}/actionlint.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${tools_dir}/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "${tools_dir}/actionlint.tar.gz" -C "${bin_dir}" actionlint
          chmod +x "${bin_dir}/actionlint"
          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Install kustomize
        env:
          KUSTOMIZE_URL: https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz
          KUSTOMIZE_SHA256: ea375e7372f9aa029129d4b2d16c66b7750b7f1213c4f66f910d981c895818d8
        run: |
          set -euo pipefail
          tools_dir="${RUNNER_TEMP}/ci-tools"
          bin_dir="${tools_dir}/bin"
          mkdir -p "${bin_dir}"
          curl -fsSL "${KUSTOMIZE_URL}" -o "${tools_dir}/kustomize.tar.gz"
          echo "${KUSTOMIZE_SHA256}  ${tools_dir}/kustomize.tar.gz" | sha256sum -c -
          tar -xzf "${tools_dir}/kustomize.tar.gz" -C "${bin_dir}" kustomize
          chmod +x "${bin_dir}/kustomize"
          echo "${bin_dir}" >> "${GITHUB_PATH}"

      # The denylist holds identifiers from private environments, so it is never
      # committed. Without it on the runner the denylist rule matches nothing and
      # the history scan passes without checking anything. Supplying it as a
      # repository secret keeps the identifiers out of Git while still enforcing
      # them here. The step fails closed if the secret is not configured.
      - name: Load private environment denylist
        env:
          SECRET_SCAN_DENYLIST_CONTENT: ${{ secrets.SECRET_SCAN_DENYLIST }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET_SCAN_DENYLIST_CONTENT}" ]; then
            echo "SECRET_SCAN_DENYLIST repository secret is not configured." >&2
            echo "The denylist rule cannot run without it, so the history scan" >&2
            echo "would report a pass it did not earn." >&2
            exit 1
          fi
          printf '%s\n' "${SECRET_SCAN_DENYLIST_CONTENT}" > "${RUNNER_TEMP}/denylist"
          echo "SECRET_SCAN_DENYLIST=${RUNNER_TEMP}/denylist" >> "${GITHUB_ENV}"

      - name: Full-history secret scan
        run: |
          set -euo pipefail
          gitleaks detect --source . --no-banner --redact --verbose
          scripts/secret-scan.sh --all
          python scripts/pre_publication_scan.py \
            --working-tree \
            --history \
            --max-bytes 5242880 \
            --denylist "${SECRET_SCAN_DENYLIST}"

      - name: Dependency audit
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/security"
          pip-audit \
            -r requirements.txt \
            -r requirements-dev.txt \
            --format=json \
            --output="${RUNNER_TEMP}/security/pip-audit.json"

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: ${{ runner.temp }}/security/trivy-fs.json
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # Kubernetes objects are scanned in rendered form. Overlay directories hold
      # strategic merge patch fragments, which are not complete objects: scanning
      # them as files reports missing fields that the base already sets.
      - name: Render Kubernetes objects for misconfiguration scanning
        run: |
          set -euo pipefail
          rendered="${RUNNER_TEMP}/security/rendered"
          mkdir -p "${rendered}"
          for environment in kind-demo retained-nginx-edge production-reference; do
            kustomize build "manifests/baseline-v1.3.1/overlays/${environment}" \
              > "${rendered}/${environment}.yaml"
            kustomize build "gitops/argocd/bootstrap/${environment}" \
              > "${rendered}/gitops-${environment}-bootstrap.yaml"
            kustomize build "gitops/argocd/managed-overlays/${environment}" \
              > "${rendered}/gitops-${environment}-managed.yaml"
          done

      - name: Trivy misconfiguration scan of rendered Kubernetes objects
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: ${{ runner.temp }}/security/rendered
          format: json
          output: ${{ runner.temp }}/security/trivy-config-rendered.json
          exit-code: "1"
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml

      - name: Trivy misconfiguration scan of repository build inputs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: manifests,gitops,build,runs
          format: json
          output: ${{ runner.temp }}/security/trivy-config-sources.json
          exit-code: "1"
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml

      - name: Workflow scan
        run: |
          set -euo pipefail
          actionlint -color=false
          python scripts/validate_workflows.py

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/security/sbom.spdx.json
          upload-artifact: false

      - name: Upload redacted security evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-evidence
          path: |
            ${{ runner.temp }}/security/*.json
          if-no-files-found: error
          retention-days: 7
