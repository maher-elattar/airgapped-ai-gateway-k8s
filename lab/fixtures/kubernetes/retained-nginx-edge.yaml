---
apiVersion: v1
kind: ConfigMap
metadata:
  name: retained-nginx-edge-config
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: retained-nginx-edge
    app.kubernetes.io/component: edge-proxy-config
    app.kubernetes.io/part-of: ai-gateway
data:
  default.conf: |
    server {
      listen 8080;
      location /v1/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://ai-gateway.ai-gateway.svc.cluster.local:80;
      }
      location / {
        return 404;
      }
      location /healthz {
        return 200;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retained-nginx-edge
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: retained-nginx-edge
    app.kubernetes.io/component: edge-proxy
    app.kubernetes.io/part-of: ai-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: retained-nginx-edge
      app.kubernetes.io/component: edge-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: retained-nginx-edge
        app.kubernetes.io/component: edge-proxy
        app.kubernetes.io/part-of: ai-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: registry.example.internal:5000/library/nginx:1.27.5-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: nginx-config
          configMap:
            name: retained-nginx-edge-config
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: retained-nginx-edge
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: retained-nginx-edge
    app.kubernetes.io/component: edge-proxy
    app.kubernetes.io/part-of: ai-gateway
spec:
  selector:
    app.kubernetes.io/name: retained-nginx-edge
    app.kubernetes.io/component: edge-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-retained-nginx-egress-to-gateway
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: retained-nginx-edge
    app.kubernetes.io/component: edge-proxy-network-policy
    app.kubernetes.io/part-of: ai-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: retained-nginx-edge
      app.kubernetes.io/component: edge-proxy
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: ai-gateway
      ports:
        - protocol: TCP
          port: 80
