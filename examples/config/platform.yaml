---
platform:
  name: airgap-ai-gateway-reference
  agentgateway_version: v1.3.1
  gateway_api_version: v1.5.0-experimental
  confirmation_token: I_UNDERSTAND_DISPOSABLE_CONTEXT_ONLY

cluster:
  expected_context: kind-airgap-ai-gateway

gateway:
  namespace: ai-gateway
  name: ai-gateway
  hostname_wildcard: "*.ai.example.internal"
  reference_grant_mode: same-namespace-only
  exposure_mode: retained-nginx

rate_limit:
  enabled: true
  backend_enabled: true
  namespace: ai-gateway
  service_name: envoy-ratelimit

registry:
  private_registry: registry.example.internal:5000
  strict_airgap: true
  images:
    - name: agentgateway
      source: >-
        cr.agentgateway.dev/agentgateway@sha256:2e25455a0185f3c5a0e0f5e0f36ccc860c754d4d26632bfa5cc41c2f5bd35141
      target: >-
        registry.example.internal:5000/agentgateway/agentgateway@sha256:2e25455a0185f3c5a0e0f5e0f36ccc860c754d4d26632bfa5cc41c2f5bd35141
    - name: agentgateway-controller
      source: >-
        cr.agentgateway.dev/controller@sha256:02c74ef7f7f2fcd6e8e13306229f0e912e2f7287ba67bbcd3a4b9597666b413b
      target: >-
        registry.example.internal:5000/agentgateway/controller@sha256:02c74ef7f7f2fcd6e8e13306229f0e912e2f7287ba67bbcd3a4b9597666b413b
    - name: envoy-ratelimit
      source: >-
        docker.io/envoyproxy/ratelimit@sha256:a8661ef320aaffbf4f10c15b40a5bd47906a7256d5c67bbf20de7fd33e562d7c
      target: >-
        registry.example.internal:5000/envoyproxy/ratelimit@sha256:a8661ef320aaffbf4f10c15b40a5bd47906a7256d5c67bbf20de7fd33e562d7c
    - name: redis
      source: >-
        docker.io/library/redis@sha256:015185fd658093359cc83aa8396e06c1f39ba36df3c93f79528ec23ab409e73f
      target: >-
        registry.example.internal:5000/library/redis@sha256:015185fd658093359cc83aa8396e06c1f39ba36df3c93f79528ec23ab409e73f
