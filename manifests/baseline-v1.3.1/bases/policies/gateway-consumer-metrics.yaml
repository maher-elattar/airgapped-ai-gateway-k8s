---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: gateway-consumer-metrics
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: gateway-consumer-metrics
    app.kubernetes.io/component: gateway-metrics-policy
    app.kubernetes.io/part-of: ai-gateway
  annotations:
    ai.gateway/consumer-id-expression: apiKey.metadata.consumer_id
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-gateway
  frontend:
    metrics:
      attributes:
        add:
          - name: consumer_id
            expression: apiKey.metadata.consumer_id
          - name: consumer_tier
            expression: apiKey.metadata.tier
          - name: application_environment
            expression: apiKey.metadata.environment
