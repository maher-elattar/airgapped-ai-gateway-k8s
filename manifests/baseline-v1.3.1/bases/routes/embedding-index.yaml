---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-embedding-index
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: route-embedding-index
    app.kubernetes.io/component: model-route
    app.kubernetes.io/part-of: ai-gateway
    ai.gateway/model-key: embedding-index
    ai.gateway/api-shape: embedding
spec:
  hostnames:
    - embed.ai.example.internal
  parentRefs:
    - name: ai-gateway
      namespace: ai-gateway
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/embeddings
      backendRefs:
        - name: embedding-nim
          namespace: ai-gateway
          port: 8000
