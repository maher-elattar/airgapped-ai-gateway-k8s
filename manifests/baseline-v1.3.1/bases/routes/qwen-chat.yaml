---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-qwen-chat
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: route-qwen-chat
    app.kubernetes.io/component: model-route
    app.kubernetes.io/part-of: ai-gateway
    ai.gateway/model-key: qwen-chat
    ai.gateway/api-shape: chat
spec:
  hostnames:
    - qwen.ai.example.internal
  parentRefs:
    - name: ai-gateway
      namespace: ai-gateway
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/chat/completions
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: qwen-chat-backend
          namespace: ai-gateway
