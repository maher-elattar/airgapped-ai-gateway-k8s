---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ai-gateway
  namespace: ai-gateway
  annotations:
    airgap.ai.gateway/exposure-contract: retained-nginx-edge-forwards-after-internal-verification
  labels:
    airgap.ai.gateway/exposure: retained-nginx-edge
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: ai-gateway-parameters
  namespace: ai-gateway
spec:
  service:
    spec:
      type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-to-gateway-data-plane
  namespace: ai-gateway
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              ai.gateway/edge-access: allowed
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: edge-proxy
      ports:
        - protocol: TCP
          port: 80
