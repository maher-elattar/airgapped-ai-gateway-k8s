---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress-to-mock-models
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: allow-gateway-ingress-to-mock-models
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: ai-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: nim-runtime
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: ai-gateway
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
