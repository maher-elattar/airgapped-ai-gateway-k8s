---
apiVersion: v1
kind: Service
metadata:
  name: external-ha-redis
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: external-ha-redis
    app.kubernetes.io/component: external-counter-store-contract
    app.kubernetes.io/part-of: ai-gateway
  annotations:
    airgap.ai.gateway/owner-boundary: external-ha-redis-owned-outside-this-repository
spec:
  type: ExternalName
  externalName: redis-ha.example.internal
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
