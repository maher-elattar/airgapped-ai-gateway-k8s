---
apiVersion: airgap.ai.gateway/v1alpha1
kind: ImageMap
metadata:
  name: baseline-v1-3-1-images
  annotations:
    airgap.ai.gateway/contract: exact-private-registry-digest-map
spec:
  privateRegistry: registry.example.internal:5000
  strictAirgap: true
  images:
    - name: agentgateway
      component: generated-data-plane
      deliveredVersion: v1.3.1
      source: cr.agentgateway.dev/agentgateway:v1.3.1
      target: registry.example.internal:5000/agentgateway/agentgateway@sha256:1111111111111111111111111111111111111111111111111111111111111111
    - name: agentgateway-controller
      component: control-plane
      deliveredVersion: v1.3.1
      source: cr.agentgateway.dev/controller:v1.3.1
      target: registry.example.internal:5000/agentgateway/controller@sha256:2222222222222222222222222222222222222222222222222222222222222222
    - name: envoy-ratelimit
      component: rate-limit-service
      deliveredVersion: demo-main-snapshot
      source: envoyproxy/ratelimit:main
      target: registry.example.internal:5000/envoyproxy/ratelimit@sha256:3333333333333333333333333333333333333333333333333333333333333333
    - name: redis
      component: demo-counter-store
      deliveredVersion: "7-alpine"
      source: redis:7-alpine
      target: registry.example.internal:5000/library/redis@sha256:4444444444444444444444444444444444444444444444444444444444444444
